<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>SpendWise</h1>
        <p>Smart Budget and Expense Tracker</p>
    </header>

    <main class="container">
        <section class="dashboard">
            <div class="card">
                <h3>Total Budget</h3>
                <p id="budget">KSh 50,000</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="expenses">KSh 15,000</p>
            </div>

            <div class="card">
                <h3>Remaining Balance</h3>
                <p id="balance">KSh 35,000</p>
            </div>
        </section>

        <section class="expense-section">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <input type="text" id="expenseName"
                    placeholder="Expense name" required>

                <input type="number" id="expenseAmount"
                    placeholder="Amount (KSh)" min="0.01"
                    step="0.01" required>

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Rent</option>
                    <option>Entertainment</option>
                    <option>Utilities</option>
                    <option>Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Expense Records</h2>

            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="expenseList"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SpendWise Budget Tracker | PLP Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
